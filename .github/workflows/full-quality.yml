name: Full Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend unit + integration + migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: lampang_bus_test
      DB_USER: root
      DB_PASSWORD: test-root-password
      ALLOW_TEST_DB_RESET: 'true'
      JWT_SECRET: test-only-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      SAFETY_POLICY_MODE: observe
      FEATURE_DRIVER_SHIFT_SELECTION: 'false'
      FEATURE_VEHICLE_QR: 'false'
      FEATURE_QR_LEVEL3: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:ci
      - run: npm run check:migrations
      - name: Rehearse database actors and complete backup
        run: node scripts/verify-db-actors.js
        env:
          ALLOW_DB_ACTOR_TEST: synthetic-local-only
          DB_ACTOR_TEST_PORT: '3306'
          DB_ACTOR_TEST_ROOT_PASSWORD: test-root-password
      - name: Verify owner switch rollback with synthetic files
        run: python3 ../ops/database/test-install-db-actors.py
      - name: Verify interrupted switch and terminal disconnect recovery
        run: python3 ../ops/database/test-recover-db-actors.py
      - name: Verify encrypted snapshots and immutable cipher-only transfer
        run: bash ../ops/backup/run-synthetic-tests.sh
      - name: Verify frontend publication and rollback with synthetic directories
        run: python3 ../scripts/test-publish-frontend.py

  frontend-build:
    name: Frontend build + strict UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Enforce UI Partial ratchet
        run: node ../scripts/ui-redesign/page-status.mjs --gate
      - name: Reconcile routes against the UI ratchet
        run: node ../scripts/ui-redesign/route-matrix.mjs --gate
      - name: Compare navigation with the reviewed baseline
        run: node ../scripts/ui-redesign/nav-snapshot.mjs --compare ../scripts/ui-redesign/baselines/nav-baseline.json
      - run: npm run check:labels:strict
      - run: npm run check:hybrid-ui
      - run: npm run build

  ui-runtime:
    name: UI runtime capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start Vite and capture the synthetic UI matrix
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > ../vite-ui-runtime.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then cat ../vite-ui-runtime.log; exit 1; fi
            sleep 1
          done
          node ../scripts/ui-redesign/capture.mjs --tag ci
        working-directory: frontend
      - name: Upload UI runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        with:
          name: ui-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/ui-redesign
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan (complete Git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "${base}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
      - name: Scan all refs and complete repository history (redacted)
        shell: bash
        run: |
          set +e
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --log-level error --report-format json --report-path "${RUNNER_TEMP}/gitleaks-report.json" >"${RUNNER_TEMP}/gitleaks-output.log" 2>&1
          scan_status=$?
          set -e
          python3 - "${RUNNER_TEMP}/gitleaks-report.json" "$scan_status" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          report_path = pathlib.Path(sys.argv[1])
          scan_status = int(sys.argv[2])
          findings = json.loads(report_path.read_text()) if report_path.exists() else []
          print(f"Gitleaks history findings: {len(findings)}")
          if findings:
              grouped = collections.Counter((item.get("File", "unknown"), item.get("RuleID", "unknown")) for item in findings)
              for (path, rule), count in sorted(grouped.items()):
                  print(f"count={count} file={path} type={rule}")
          if scan_status != 0:
              print(f"Gitleaks scan failed with exit code {scan_status}")
              sys.exit(scan_status)
          PY
