name: Full Quality

# Runs the DB-free quality gates on every push and pull request:
#   - backend unit tests (mock-pool, no MySQL needed)
#   - frontend production build
#   - UI Thai-label check
#
# The DB-backed integration suite (`npm run test:ci`) is intentionally NOT run
# here. It requires a disposable `lampang_bus_test` database
# (DB_NAME=lampang_bus_test, ALLOW_TEST_DB_RESET=true) and is run locally by the
# team — see backend/.env.test.example and the implementation plan. Wiring a
# MySQL service container + schema load can be added later; until then this
# workflow keeps PRs fast and never touches a real database.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests (DB-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  frontend-build:
    name: Frontend build + UI label check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # UI label check lives at repo-root scripts/; the frontend script invokes
      # it via `node ../scripts/check-ui-labels.js`. Advisory (non-strict) so a
      # pre-existing legacy warning does not fail the build.
      - run: npm run check:labels
      - run: npm run build
