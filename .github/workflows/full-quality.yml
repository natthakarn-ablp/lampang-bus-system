name: Full Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend unit + integration + migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: lampang_bus_test
      DB_USER: root
      DB_PASSWORD: test-root-password
      ALLOW_TEST_DB_RESET: 'true'
      JWT_SECRET: test-only-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      SAFETY_POLICY_MODE: observe
      FEATURE_DRIVER_SHIFT_SELECTION: 'false'
      FEATURE_VEHICLE_QR: 'false'
      FEATURE_QR_LEVEL3: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:ci
      - run: npm run check:migrations

  frontend-build:
    name: Frontend build + strict UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:labels:strict
      - run: npm run check:hybrid-ui
      - run: npm run build
